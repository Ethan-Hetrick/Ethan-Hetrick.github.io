  - title: Selected Graduate Coursework Projects
    layout: list
    content:
      - layout: top
        title: FCGR Taxonomic Classification
        link: https://github.com/Ethan-Hetrick/FCGR_classifier
        link_text: View Project
        description: Showed that linear models using Frequency Chaos Game Representations match or outperform a CNN benchmark for low-level *Salmonella* classification across hundreds of thousands of genomes, achieving near-perfect macro-F1 at a fraction of the compute.
      - layout: top
        title: Protein Mutation Fitness Prediction
        description: Built and tuned a RankNet model with ESM-1v embeddings, PyTorch Lightning, and Optuna k-fold hyperparameter search for deep mutational scanning fitness prediction.
      - layout: top
        title: MMR Coverage & Measles Wastewater Surveillance
        description: Analyzed CDC wastewater and vaccination data in R using nonparametric testing and quasibinomial regression.

  - title: Technical Skills
    layout: text
    content: |
      **Languages & data:** Python, R, SQL/DuckDB, Bash, Rust, Groovy/Nextflow; pandas, NumPy, SciPy, Parquet/PyArrow

      **Statistical computing:** brms/rstan, tidybayes; Bayesian regression, MCMC, GLMs, FFT convolution, PCA, hypothesis testing, uncertainty propagation, power analysis

      **Pipeline engineering:** Nextflow (DSL1/DSL2), nf-core, nf-test, ETL, legacy migration, input validation, data-quality checks, reusable configuration

      **Computing & infrastructure:** Linux, HPC, SGE/UGE, SLURM, parallel processing, memory and runtime optimization

      **Containers & version control:** Docker, Singularity/Apptainer, Git, GitLab CI/CD, GitHub Actions, pixi, conda, uv

      **Genomics:** Alignment, comparative genomics, phylogenetics, annotation, bulk RNA-Seq, variant calling, *de novo* assembly, pangenomes, *in-silico* PCR

  - title: Selected Projects
    layout: list
    content:
      - layout: top
        title: Microbial Eukaryote Comparative Genomics
        description: Constructed a DuckDB database of ~100 million pairwise comparisons (~10,000 genomes); analyzed ~80 genera and 1,000+ species using multinomial logistic regression, graph clustering, and precision–recall/F1 evaluation. Co-first author (in review).
      - layout: top
        title: nf-core contributor
        link: https://github.com/nf-core/modules
        link_text: View Repository
        description: Authored and merged an average nucleotide identity module with an nf-test and passing required CI/CD checks.
      - layout: top
        title: FoodNet Trends
        description: Implemented Bayesian negative-binomial spline regression in R with population offsets, posterior incidence estimates, credible intervals, and configurable MCMC workflows across 10 U.S. sites.
      - layout: top
        title: fasterANI
        description: Built a multithreaded, memory-safe ANI implementation in Rust using minimizer sketches, cached indexes, memory mapping, and bounded parallelism; achieved roughly 5× faster runtime and lower peak memory with near-perfect FastANI correlation.
      - layout: top
        title: ARX Threat Report
        description: Reimplemented national antimicrobial-resistance burden aggregation in vectorized Python with FFT convolution across ~20 pathogens, reducing a non-completing workflow to under a minute.
      - layout: top
        title: neissflow
        description: Portable production workflow for *Neisseria gonorrhoeae* genomic epidemiology, adopted by state and international partners.
      - layout: top
        title: RADish
        description: End-to-end ddRAD-seq workflow for mosquito insecticide-resistance surveillance, SNP comparisons, Fisher's exact tests, PCA, and annotation.
      - layout: top
        title: PolkaPox
        link: https://github.com/CDCgov/polkapox
        link_text: View Repository
        description: Co-authored a Nextflow workflow for QC, reference analysis, and *de novo* assembly of orthopoxvirus Illumina reads.
      - layout: top
        title: wf-assembly-snps
        description: Modular bacterial workflow producing core-genome alignments, SNP distances, recombination-aware phylogenies, and annotated visualizations.
      - layout: top
        title: seqlint
        link: https://github.com/Ethan-Hetrick/seqlint
        link_text: View Repository
        description: Rust command-line linter providing integrity, format, compression, encoding, IUPAC, and FASTA/FASTQ checks.
      - layout: top
        title: Additional workflows
        description: "**LEGION:** *Legionella* identification, typing, assembly, and phylogenetics. **Arbovirus Metagenomics:** metagenomic detection and assembly evaluation. **SPN Typing Workflow:** end-to-end *S. pneumoniae* typing, AMR analysis, and reporting."

