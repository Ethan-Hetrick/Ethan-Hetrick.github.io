about_content: |
  Public-health scientist and bioinformatics developer with 5+ years supporting national disease surveillance, outbreak response, and research at the CDC. Trusted technical consultant and lead who has advised on 30+ projects, guided teams through critical transitions, mentored early-career scientists, and trained hundreds of colleagues across the agency. Combines deep computational expertise with a record of delivering reliable, reproducible tools that public-health laboratories depend on, including during active outbreak response.

content:
  - title: Professional Experience
    layout: list
    content:
      - layout: left
        title: Bioinformatics Developer
        sub_title: Leidos supporting CDC Scientific Computing
        caption: "Atlanta, GA | April 2023 – Present"
        description: |
          *Junior-level: April 2023 – June 2025; Mid-level: June 2025 – Present*

          Office of Advanced Molecular Detection; National Center for Emerging and Zoonotic Infectious Diseases; Centers for Disease Control and Prevention

          - Serve as a primary technical consultant across CDC disease programs, advising on 30+ projects and translating scientific needs into reliable production tools for surveillance, outbreak analysis, and research.
          - Led development on 5+ bioinformatics projects, delegating tasks and directing analysis design from concept through delivery.
          - Served as interim team lead through three leadership transitions (~6 months total), coordinating developers, DevOps, and helpdesk staff and reporting to CDC leadership.
          - Designed and delivered agency-wide training reaching hundreds of scientists and developers; created CDC's Nextflow curriculum.
          - Mentored two interns and a junior engineer and served on numerous hiring panels.
          - Played a lead role in modernizing CDC's HPC environment, supporting migration of over a thousand software tools.
          - Built shared automation, procedures, and configuration adopted across dozens of workflows.
          - Provide frontline technical support, meeting quarterly SLA targets and resolving 3× the team average within SLA last quarter.
          - Contributed technical writing to contract acquisition and served as an HHS training administrator.
      - layout: left
        title: Microbiology Fellow
        sub_title: ORISE / CDC National Salmonella Reference Laboratory
        caption: "Atlanta, GA | July 2021 – April 2023"
        description: |
          - Characterized hundreds of clinical, outbreak, research, and international *Salmonella* isolates under CLIA-certified protocols.
          - Prototyped a whole-genome sequencing pipeline for *Salmonella* subtyping in a regulated reference laboratory.
          - Investigated serotype determinants using comparative genomics, identifying a candidate mechanism for an unexplained antigenic phenotype.
          - Performed end-to-end Illumina and Oxford Nanopore sequencing and supported international collaborations and the reference culture collection.
          - Processed and inventoried specimens, maintained storage and documentation, and reported results in ELIMS.
      - layout: left
        title: Bioinformatician, Outbreak Response Deployment
        sub_title: CDC Multinational Mpox Response
        caption: "Atlanta, GA | July 2022 – September 2022"
        description: |
          - Contributed to CDC's mpox genome assembly and annotation pipeline during an active international outbreak.
          - Performed SNP analysis supporting mpox clade designation for a WHO advisory meeting.
          - Developed methods for repetitive genome regions and integrated them into the response pipeline.
          - Benchmarked host-read removal, enabling removal of host-derived PII and higher-quality *de novo* assemblies.
      - layout: left
        title: Clinical Laboratory Assistant
        sub_title: IU Ball Memorial Hospital, Pathology Laboratory
        caption: "Muncie, IN | December 2020 – July 2021"
        description: |
          - Managed patient specimens and physician orders in Cerner and performed diagnostic RT-qPCR, immunofluorescence, and other pathogen assays.
          - Ran quality controls on new assay lots; trained in CLIA/HIPAA regulations and laboratory safety.

